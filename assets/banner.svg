<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Nikita Kusenov, Backend Engineer, Python and Go. A host writes to two storage systems with synchronous replication between them; when one path fails, traffic fails over to the other storage in 12 seconds.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#111d36"/><stop offset="1" stop-color="#0c2a30"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/>
  </linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5eead4" stop-opacity="0.28"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.75" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
  </pattern>
  <clipPath id="card"><rect width="1200" height="420" rx="22"/></clipPath>
  <clipPath id="chartclip"><rect x="700" y="338" width="446" height="56"/></clipPath>
  <path id="toA" d="M880 70 C880 98, 750 92, 750 122"/>
  <path id="toB" d="M930 70 C930 98, 1060 92, 1060 122"/>
  <path id="repAB" d="M850 205 H960"/>
  <path id="repBA" d="M960 225 H850"/>
</defs>
<style>
  .name { font: 700 60px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
  .role { font: 600 28px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: url(#accent); }
  .tags { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b9bb4; }
  .title { font: 700 12px ui-monospace, Menlo, Consolas, monospace; fill: #9fb3d1; letter-spacing: 1px; }
  .label { font: 600 11px ui-monospace, Menlo, Consolas, monospace; fill: #6b7d9c; }
  .caption { font: 600 11px ui-monospace, Menlo, Consolas, monospace; fill: #7d90b0; letter-spacing: 0.5px; }
  .box { fill: #111c33; stroke: #2b3c5e; stroke-width: 1.5; }
  .ctrl { fill: #17284a; stroke: #2b3c5e; }
  .shelf { fill: #0d1730; stroke: #22314f; }
  .drive { fill: #121f3a; stroke: #2e4166; }
  .platter { fill: #0b1428; stroke: #3b5378; stroke-width: 1.5; }
  .spindle { fill: #4a6390; }
  .spin { fill: none; stroke: #5eead4; stroke-width: 2; stroke-dasharray: 9 61; stroke-linecap: round; opacity: 0.8;
          transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
  .led { animation: blink 2.4s ease-in-out infinite; }
  .wire { fill: none; }
  .scroll { animation: scroll 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes scroll { to { transform: translateX(-120px); } }
  @media (prefers-reduced-motion: reduce) { .spin, .led, .scroll { animation: none; } }
</style>

<g clip-path="url(#card)">
  <rect width="1200" height="420" fill="url(#bg)"/>
