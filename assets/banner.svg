<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nikita Kusenov, Backend Engineer, Python and Go">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111d36"/>
      <stop offset="1" stop-color="#0c2a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .name { font: 700 64px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .role { font: 600 30px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: url(#accent); }
    .tags { font: 400 20px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b9bb4; letter-spacing: 0.3px; }
    .unit { fill: #16233d; stroke: #2b3c5e; stroke-width: 1.5; }
    .bay { fill: #0e1830; stroke: #263553; }
    .label { font: 600 13px ui-monospace, Menlo, Consolas, monospace; fill: #5b6b88; }
    .led { fill: #34d399; animation: blink 2.4s ease-in-out infinite; }
    .led.b { fill: #60a5fa; }
    .pulse { fill: #5eead4; animation: travel 2.8s linear infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes travel { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(52px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .led, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
  </g>

  <text class="name" x="72" y="138">Nikita Kusenov</text>
  <text class="role" x="74" y="190">Backend Engineer · Python &amp; Go</text>
  <text class="tags" x="75" y="240">storage systems  ·  high availability  ·  observability  ·  AI agents</text>

  <g transform="translate(838 58)">
    <rect class="unit" width="290" height="78" rx="10"/>
    <text class="label" x="16" y="45">CTRL A</text>
    <g transform="translate(86 14)">
      <rect class="bay" width="44" height="50" rx="5"/><circle class="led" cx="22" cy="40" r="3.5"/>
      <rect class="bay" x="50" width="44" height="50" rx="5"/><circle class="led" cx="72" cy="40" r="3.5" style="animation-delay:.6s"/>
      <rect class="bay" x="100" width="44" height="50" rx="5"/><circle class="led" cx="122" cy="40" r="3.5" style="animation-delay:1.2s"/>
      <rect class="bay" x="150" width="44" height="50" rx="5"/><circle class="led" cx="172" cy="40" r="3.5" style="animation-delay:1.8s"/>
    </g>

    <line x1="145" y1="78" x2="145" y2="130" stroke="#2b3c5e" stroke-width="2" stroke-dasharray="4 5"/>
    <circle class="pulse" cx="145" cy="78" r="4"/>

    <g transform="translate(0 130)">
      <rect class="unit" width="290" height="78" rx="10"/>
      <text class="label" x="16" y="45">CTRL B</text>
      <g transform="translate(86 14)">
        <rect class="bay" width="44" height="50" rx="5"/><circle class="led b" cx="22" cy="40" r="3.5" style="animation-delay:.3s"/>
        <rect class="bay" x="50" width="44" height="50" rx="5"/><circle class="led b" cx="72" cy="40" r="3.5" style="animation-delay:.9s"/>
        <rect class="bay" x="100" width="44" height="50" rx="5"/><circle class="led b" cx="122" cy="40" r="3.5" style="animation-delay:1.5s"/>
        <rect class="bay" x="150" width="44" height="50" rx="5"/><circle class="led b" cx="172" cy="40" r="3.5" style="animation-delay:2.1s"/>
      </g>
    </g>
  </g>
</svg>
